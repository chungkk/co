server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # IP thật của người dùng: bỏ qua các proxy nội bộ (Coolify/Traefik) từ phải sang trái trong X-Forwarded-For,
  # không tin phần client tự ghi vào. Máy chủ Node đọc X-Real-IP để giới hạn số yêu cầu mỗi IP.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  # chơi online: luồng sự kiện (Server-Sent Events) không được đệm, giữ kết nối lâu
  location /api/online/events {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  # máy chủ phân tích Pikafish và chơi online (server/engine-server.js)
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    client_max_body_size 4k;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
